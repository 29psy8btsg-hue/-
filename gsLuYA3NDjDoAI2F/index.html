<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="夢門塾冒険の書">
<title>夢門塾 冒険の書</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
:root{
  --sky:#4EC5E0; --sky-d:#2BA8C9; --pink:#E8197D; --pink-l:#F687C0;
  --navy:#1A3A6B; --yellow:#FFC93C; --green:#22C55E; --purple:#8B5CF6;
  --red:#EF4444; --orange:#FF8C42;
}
html,body{ height:100%; }
body{
  font-family:-apple-system,'Hiragino Kaku Gothic ProN','Hiragino Sans',sans-serif;
  background:linear-gradient(180deg,#4EC5E0 0%,#7DD8EC 40%,#E0F7FD 100%);
  background-attachment:fixed; color:var(--navy);
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  -webkit-text-size-adjust:100%;
}
.clouds{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
.cloud{ position:absolute; background:rgba(255,255,255,.5); border-radius:50%; animation:cloudFloat linear infinite; }
@keyframes cloudFloat{
  from{transform:translateX(-120%)}
  to{transform:translateX(110vw)}
}
.wrap{ position:relative; z-index:1; max-width:700px; margin:0 auto; padding:16px 16px 40px; }

/* === ヘッダー === */
.header{ background:#fff; border-radius:22px; padding:16px 18px; margin-bottom:14px;
  box-shadow:0 6px 22px rgba(26,58,107,.15); border:3px solid var(--sky); }
.hrow{ display:flex; align-items:center; gap:12px; }
.havatar{ width:62px; height:62px; border-radius:18px; flex-shrink:0;
  background:linear-gradient(135deg,var(--sky),var(--pink)); display:flex;
  align-items:center; justify-content:center; font-size:32px;
  animation:floaty 3s ease-in-out infinite; cursor:pointer;
  box-shadow:0 4px 12px rgba(78,197,224,.4); transition:.2s; }
.havatar:active{ transform:scale(.92); }
@keyframes floaty{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
.hname{ flex:1; }
.hname input{ border:none; border-bottom:2px dashed var(--sky); background:transparent;
  font-size:17px; font-weight:800; color:var(--navy); width:100%; padding:3px 0; outline:none;
  -webkit-user-select:text; user-select:text; }
.hrank{ font-size:13px; font-weight:700; margin-top:3px; display:flex; align-items:center; gap:4px; }
.hpt{ text-align:center; background:rgba(255,201,60,.18); border-radius:14px; padding:7px 14px; border:2px solid var(--yellow); }
.hpt b{ font-size:22px; font-weight:900; color:var(--orange); line-height:1; display:block; }
.hpt span{ font-size:10px; font-weight:700; }
.pbar-wrap{ margin-top:12px; }
.pbar-label{ font-size:11px; display:flex; justify-content:space-between; margin-bottom:4px; }
.pbar{ height:9px; background:#E5E7EB; border-radius:6px; overflow:hidden; }
.pbar-fill{ height:100%; background:linear-gradient(90deg,var(--sky),var(--pink)); border-radius:6px; transition:width .6s ease; }

/* === タブ === */
.tabs{ display:flex; gap:5px; margin-bottom:14px; flex-wrap:nowrap; overflow-x:auto; }
.tabs::-webkit-scrollbar{ display:none; }
.tab{ flex:0 0 auto; padding:9px 8px; border-radius:13px; border:none; background:#fff; color:var(--navy);
  font-weight:800; font-size:11px; box-shadow:0 2px 7px rgba(0,0,0,.08); cursor:pointer; transition:.2s;
  font-family:inherit; min-width:56px; }
.tab .ti{ font-size:17px; display:block; margin-bottom:2px; }
.tab.active{ background:linear-gradient(135deg,var(--pink),var(--pink-l)); color:#fff;
  box-shadow:0 4px 13px rgba(232,25,125,.4); }
.tab:active{ transform:scale(.94); }

/* === セクション === */
.sect{ margin-bottom:14px; }
.sect-h{ display:flex; align-items:center; gap:9px; }
.sect-bar{ width:5px; height:23px; border-radius:3px; }
.sect-icon{ font-size:18px; }
.sect-title{ font-size:17px; font-weight:900; }
.sect-sub{ font-size:11px; color:#6B7280; margin-left:19px; margin-top:1px; }

/* === ミッション === */
.mission{ display:flex; align-items:center; gap:11px; background:#fff; border-radius:15px;
  padding:13px 13px; margin-bottom:8px; border:2px solid #E5E7EB; transition:.2s; cursor:pointer;
  box-shadow:0 2px 8px rgba(0,0,0,.05); }
.mission:active{ transform:scale(.97); }
.mission.done{ background:rgba(34,197,94,.10); border-color:var(--green); }
.mcheck{ width:30px; height:30px; border-radius:9px; flex-shrink:0; background:#fff;
  border:2.5px solid var(--sky); display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:16px; font-weight:900; transition:.3s; }
.mission.done .mcheck{ background:var(--green); border-color:var(--green); animation:checkPop .4s ease; }
@keyframes checkPop{ 0%{transform:scale(.5)} 60%{transform:scale(1.2)} 100%{transform:scale(1)} }
.micon{ font-size:20px; }
.mtext{ flex:1; font-size:14px; font-weight:700; line-height:1.3; }
.mission.done .mtext{ text-decoration:line-through; color:#9CA3AF; }
.mstat{ font-size:10px; font-weight:700; padding:3px 8px; border-radius:9px; white-space:nowrap; }
.mpt{ font-size:12px; font-weight:800; color:var(--orange); white-space:nowrap; }

/* === ウィークリー === */
.wcard{ background:#fff; border-radius:15px; padding:13px; margin-bottom:8px;
  border:2px solid #E5E7EB; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.wcard.done{ border-color:var(--yellow); }
.wtop{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
.wbtn{ background:linear-gradient(135deg,var(--purple),#A78BFA); color:#fff; border:none;
  border-radius:10px; padding:8px 16px; font-size:12px; font-weight:800; cursor:pointer;
  font-family:inherit; transition:.2s; }
.wbtn:active{ transform:scale(.94); }
.wprog{ display:flex; align-items:center; gap:9px; }
.wbar{ flex:1; height:10px; background:#E5E7EB; border-radius:5px; overflow:hidden; }
.wbar-fill{ height:100%; border-radius:5px; transition:width .5s ease; }

/* === ストーリー === */
.story{ background:linear-gradient(135deg,var(--navy),#2D4F8B); border-radius:17px; padding:15px;
  margin-bottom:10px; color:#fff; box-shadow:0 4px 14px rgba(26,58,107,.3); }
.story-top{ display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.story-bar{ flex:1; height:12px; background:rgba(255,255,255,.2); border-radius:6px; overflow:hidden; }
.story-fill{ height:100%; background:linear-gradient(90deg,var(--yellow),var(--orange)); border-radius:6px; transition:width .6s ease; }

/* === インフォ === */
.info{ border-radius:15px; padding:13px 15px; margin-top:14px; font-size:12px; line-height:1.55; }
.info-green{ background:rgba(34,197,94,.13); border:2px dashed var(--green); }
.info-yellow{ background:rgba(255,201,60,.18); border:2px solid var(--yellow); }
.info-sky{ background:rgba(78,197,224,.13); border:2px dashed var(--sky); }

/* === ステータス === */
.chartbox{ background:#fff; border-radius:18px; padding:14px 8px; margin-bottom:14px;
  border:3px solid var(--sky); box-shadow:0 4px 14px rgba(78,197,224,.2); }
.statgrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.statcard{ background:#fff; border-radius:15px; padding:12px 13px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.statcard-top{ display:flex; align-items:center; gap:7px; margin-bottom:7px; }
.statcard-icon{ font-size:19px; }
.statcard-name{ font-size:13px; font-weight:800; }
.statcard-lv{ margin-left:auto; font-size:16px; font-weight:900; }
.statbar{ height:8px; background:#EEF2F5; border-radius:4px; overflow:hidden; margin-bottom:5px; }
.statbar-fill{ height:100%; border-radius:4px; transition:width .5s ease; }
.statdesc{ font-size:9px; color:#6B7280; line-height:1.3; }
.staffbox{ margin-top:14px; background:rgba(26,58,107,.05); border-radius:15px; padding:13px; border:2px solid rgba(26,58,107,.13); }
.staffbtns{ display:flex; flex-wrap:wrap; gap:7px; }
.staffbtn{ border-radius:11px; padding:9px 13px; font-size:12px; font-weight:800; cursor:pointer; font-family:inherit; border-width:2px; border-style:solid; background:#fff; transition:.2s; }
.staffbtn:active{ transform:scale(.94); }

/* === タイマー === */
.timer-wrap{ background:#fff; border-radius:22px; padding:24px; margin-bottom:14px;
  border:3px solid var(--sky); box-shadow:0 4px 14px rgba(78,197,224,.2); text-align:center; }
.timer-presets{ display:flex; gap:8px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
.timer-preset{ border:2.5px solid var(--sky); border-radius:12px; padding:9px 16px; background:#fff;
  font-size:13px; font-weight:800; cursor:pointer; font-family:inherit; color:var(--navy); transition:.2s; }
.timer-preset.sel{ background:linear-gradient(135deg,var(--sky),var(--sky-d)); color:#fff; border-color:var(--sky-d); }
.timer-preset:active{ transform:scale(.94); }
.timer-ring{ position:relative; width:200px; height:200px; margin:0 auto 20px; }
.timer-ring svg{ transform:rotate(-90deg); }
.timer-ring-bg{ fill:none; stroke:#E5E7EB; stroke-width:12; }
.timer-ring-fg{ fill:none; stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset .9s linear, stroke .4s; }
.timer-time{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:38px; font-weight:900; color:var(--navy); line-height:1; }
.timer-phase{ position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  font-size:11px; font-weight:800; color:#6B7280; white-space:nowrap; }
.timer-btns{ display:flex; gap:10px; justify-content:center; }
.timer-btn{ border:none; border-radius:16px; padding:14px 28px; font-size:15px; font-weight:900;
  cursor:pointer; font-family:inherit; transition:.2s; color:#fff; }
.timer-btn:active{ transform:scale(.95); }
.timer-btn.start{ background:linear-gradient(135deg,var(--green),#16A34A); box-shadow:0 4px 14px rgba(34,197,94,.4); }
.timer-btn.stop{ background:linear-gradient(135deg,var(--red),#DC2626); box-shadow:0 4px 14px rgba(239,68,68,.35); }
.timer-btn.reset{ background:#E5E7EB; color:#6B7280; }
.timer-streak{ background:rgba(255,201,60,.18); border:2px solid var(--yellow);
  border-radius:14px; padding:11px 14px; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.timer-tip{ background:rgba(139,92,246,.12); border:2px dashed var(--purple); border-radius:14px; padding:12px 14px; font-size:12px; line-height:1.6; }

/* === バッジ === */
.badge-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.badge-card{ background:#fff; border-radius:15px; padding:12px 8px; text-align:center;
  border:2.5px solid #E5E7EB; transition:.2s; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.badge-card.unlocked{ border-color:var(--yellow); background:rgba(255,201,60,.08); animation:badgePop .5s ease; }
@keyframes badgePop{ 0%{transform:scale(.8);opacity:0} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }
.badge-emoji{ font-size:32px; margin-bottom:6px; display:block;
  filter:grayscale(1); transition:.4s; }
.badge-card.unlocked .badge-emoji{ filter:none; }
.badge-name{ font-size:10px; font-weight:800; color:#1A3A6B; line-height:1.3; }
.badge-card:not(.unlocked) .badge-name{ color:#9CA3AF; }
.badge-cond{ font-size:9px; color:#6B7280; margin-top:2px; line-height:1.2; }

/* === 感情 === */
.emo{ border-radius:15px; padding:13px 15px; margin-bottom:9px; border-width:2.5px; border-style:solid;
  display:flex; align-items:center; gap:13px; cursor:pointer; transition:.2s;
  box-shadow:0 2px 8px rgba(0,0,0,.05); }
.emo:active{ transform:scale(.97); }
.emo-emoji{ font-size:28px; transition:.3s; }
.emo.active .emo-emoji{ animation:emoWiggle .5s ease; }
@keyframes emoWiggle{ 0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(10deg)} }
.emo-label{ font-size:14px; font-weight:800; }
.emo-advice{ font-size:11px; color:#fff; margin-top:4px; line-height:1.5; display:none; }
.emo.active .emo-advice{ display:block; }
.emo-bars{ display:flex; gap:3px; margin-left:auto; }
.emo-bar{ width:7px; height:22px; border-radius:3px; opacity:.85; }

/* === ごほうび === */
.reward{ background:#fff; border-radius:15px; padding:13px 15px; margin-bottom:9px;
  border:2px solid #E5E7EB; display:flex; align-items:center; gap:13px;
  box-shadow:0 2px 8px rgba(0,0,0,.05); }
.reward.can{ border-color:var(--orange); }
.reward.cant{ opacity:.6; }
.reward-icon{ font-size:28px; }
.reward-text{ flex:1; font-size:13px; font-weight:700; }
.reward-btn{ border:none; border-radius:12px; padding:10px 16px; font-size:13px; font-weight:800;
  white-space:nowrap; font-family:inherit; cursor:pointer; transition:.2s; }
.reward-btn:active{ transform:scale(.94); }
.reward-btn.can{ background:linear-gradient(135deg,var(--orange),var(--yellow)); color:#fff;
  box-shadow:0 3px 10px rgba(255,140,66,.4); }
.reward-btn.cant{ background:#E5E7EB; color:#9CA3AF; }
.claimed{ display:flex; align-items:center; gap:9px; background:rgba(34,197,94,.10);
  border-radius:12px; padding:9px 13px; margin-bottom:7px; }

/* === きろく === */
.hist-card{ background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:9px;
  border:2px solid #E5E7EB; box-shadow:0 2px 8px rgba(0,0,0,.05); }
.hist-card.today{ border-color:var(--sky); }

/* === 保存バー === */
.savebar{ display:flex; gap:8px; margin-top:18px; }
.savebtn{ flex:1; border:none; border-radius:14px; padding:14px; font-size:13px; font-weight:800;
  font-family:inherit; cursor:pointer; color:#fff; box-shadow:0 4px 12px rgba(0,0,0,.12); transition:.2s; }
.savebtn:active{ transform:scale(.97); }
.savebtn.export{ background:linear-gradient(135deg,var(--green),#16A34A); }
.savebtn.import{ background:linear-gradient(135deg,var(--sky),var(--sky-d)); }
.savebtn.reset{ background:#fff; color:var(--red); border:2px solid var(--red); box-shadow:none; }
.savenote{ font-size:10px; color:var(--navy); opacity:.7; text-align:center; margin-top:10px; line-height:1.5; }

/* === フラッシュ === */
.flash{ position:fixed; top:calc(env(safe-area-inset-top) + 14px); left:50%; transform:translateX(-50%);
  background:linear-gradient(135deg,var(--pink),var(--orange)); color:#fff; padding:13px 24px;
  border-radius:16px; z-index:300; font-size:14px; font-weight:800;
  box-shadow:0 8px 25px rgba(232,25,125,.5); max-width:90%; text-align:center;
  animation:pop .4s ease; display:none; }
@keyframes pop{ 0%{transform:translateX(-50%) scale(.7);opacity:0} 55%{transform:translateX(-50%) scale(1.08)} 100%{transform:translateX(-50%) scale(1);opacity:1} }
.fade{ animation:fadein .3s ease; }
@keyframes fadein{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

/* === コンフェッティ === */
.confetti-piece{ position:fixed; width:10px; height:10px; border-radius:2px;
  pointer-events:none; z-index:400; }

/* === キャラ選択 === */
.avatar-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-top:10px; }
.avatar-opt{ font-size:28px; text-align:center; padding:8px; border-radius:12px;
  border:2px solid transparent; cursor:pointer; transition:.2s; background:#fff; }
.avatar-opt.sel{ border-color:var(--pink); background:rgba(232,25,125,.1); }
.avatar-opt:active{ transform:scale(.9); }

/* === PINロック === */
.pin-pad button{ transition:.15s; }
.pin-pad button:active{ transform:scale(.9); background:#E0F7FD !important; }

/* === バトル === */
.bstage{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:8px 0; }
.b-field{ width:100%; display:flex; justify-content:space-between; align-items:flex-end; padding:4px 0 8px; }
.b-hpanel{ flex:1; display:flex; flex-direction:column; gap:4px; }
.b-hpanel.right{ align-items:flex-end; }
.b-hname{ font-size:12px; font-weight:700; color:#555; }
.bhp-row{ display:flex; align-items:center; gap:4px; font-size:12px; font-weight:700; }
.bhp-bar{ flex:1; height:12px; background:#ddd; border-radius:6px; overflow:hidden; }
.bhp-fill{ height:100%; border-radius:6px; transition:width .4s; }
.bhp-fill.hero{ background:linear-gradient(90deg,#4EC5E0,#22C55E); }
.bhp-fill.enemy{ background:linear-gradient(90deg,#FF8C42,#EF4444); }
.b-ap{ display:flex; gap:3px; justify-content:center; flex-wrap:wrap; }
.b-ap-pip{ width:12px; height:12px; border-radius:50%; border:2px solid #aaa; background:#eee; transition:.2s; }
.b-ap-pip.on{ background:#FFD23F; border-color:#F59E0B; }
.b-char{ font-size:52px; line-height:1; text-align:center; }
.b-char.enemy-c{ animation:bIdleC 2s ease-in-out infinite; }
.b-char.hero-c{ animation:bIdle 1.8s ease-in-out infinite; }
.b-tpill{ display:inline-block; font-size:11px; font-weight:700; padding:3px 10px;
  border-radius:20px; background:#E8F4FD; color:#0284C7; margin-bottom:2px; }
.b-log{ width:100%; min-height:56px; max-height:80px; overflow-y:auto;
  background:#F8FAFF; border-radius:10px; padding:8px 10px; font-size:12px;
  line-height:1.6; border:1px solid #E2EEFF; }
.b-log p{ margin:0 0 2px; }
.bcmd-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
.bcmd{ padding:8px 6px; border-radius:12px; border:none; font-size:13px; font-weight:700;
  cursor:pointer; color:#fff; box-shadow:0 3px 0 rgba(0,0,0,.18); transition:.15s;
  display:flex; flex-direction:column; align-items:center; gap:2px; }
.bcmd:active:not(:disabled){ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
.bcmd:disabled{ opacity:.4; cursor:not-allowed; }
.bcmd .bicon{ font-size:20px; }
.bcmd .bname{ font-size:11px; }
.bcmd .bcost{ font-size:10px; background:rgba(0,0,0,.2); border-radius:6px;
  padding:1px 5px; min-width:24px; text-align:center; }
.bcmd .bdesc{ font-size:9px; opacity:.88; margin-top:1px; line-height:1.2; }
.bcmd.wide{ grid-column:span 2; }
.b-enemy-hp{ width:100%; margin-top:4px; }
.b-enemy-hp-label{ display:flex; justify-content:space-between; align-items:center;
  font-size:11px; font-weight:800; color:#EF4444; margin-bottom:3px; }
.b-enemy-hp-num{ font-size:13px; font-weight:900; color:#EF4444; }
.b-res{ width:100%; text-align:center; padding:16px 8px; }
.b-res .b-res-emoji{ font-size:52px; }
.b-res h3{ margin:8px 0 4px; font-size:18px; }
.b-res p{ font-size:13px; color:#666; margin:0 0 12px; }
.b-res button{ padding:10px 24px; border:none; border-radius:14px; font-size:15px;
  font-weight:700; cursor:pointer; color:#fff; background:var(--blue); box-shadow:0 3px 0 rgba(0,0,0,.2); }
.bdmg{ position:absolute; font-size:22px; font-weight:900; pointer-events:none;
  animation:btwk .8s forwards; z-index:10; }
@keyframes bshake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
@keyframes bIdleC{ 0%,100%{transform:translateY(0) rotate(-3deg)} 50%{transform:translateY(-6px) rotate(3deg)} }
@keyframes bIdle{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
@keyframes btwk{ 0%{opacity:1;transform:translateY(0)} 100%{opacity:0;transform:translateY(-36px)} }
</style>
</head>
<body>
<div class="clouds" id="clouds"></div>
<div class="flash" id="flash"></div>
<div class="wrap">

  <!-- ヘッダー -->
  <div class="header">
    <div class="hrow">
      <div class="havatar" id="avatar" onclick="openProfileModal()" title="タップして冒険者を切りかえる">🌱</div>
      <div class="hname">
        <input id="nameInput" placeholder="なまえを入力" maxlength="12" autocomplete="off">
        <div class="hrank" id="rankLabel">見習い冒険者</div>
      </div>
      <div class="hpt"><b id="availPt">0</b><span>つかえるpt</span></div>
    </div>
    <div class="pbar-wrap" id="rankProgWrap">
      <div class="pbar-label"><span id="nextRankText"></span><span id="nextRankPt"></span></div>
      <div class="pbar"><div class="pbar-fill" id="rankProg" style="width:0%"></div></div>
    </div>
  </div>

  <!-- タブ -->
  <div class="tabs" id="tabs"></div>

  <!-- コンテンツ -->
  <div id="content"></div>

  <!-- 保存バー -->
  <div class="savebar">
    <button class="savebtn export" onclick="exportData()">📤 きろくを かきだす</button>
    <button class="savebtn import" onclick="document.getElementById('fileInput').click()">📥 よみこむ</button>
  </div>
  <div class="savebar">
    <button class="savebtn reset" onclick="resetData()">🔄 さいしょから</button>
  </div>

function defaultProfile(name, avatar){

function defaultRoot(){
  const id="p"+Date.now();
  return {
    current:id,
    staffPin:"1111",
    customDaily:null, customWeekly:null, customRewards:null,
    profiles:{ [id]: defaultProfile() }
  };
}

function loadRoot(){
  // 新フォーマットを優先
  try{
    const r=localStorage.getItem(ROOT_KEY);
    if(r){
      const root=Object.assign(defaultRoot(), JSON.parse(r));
      if(!root.profiles || typeof root.profiles!=='object' || Object.keys(root.profiles).length===0){
        const d=defaultRoot(); root.profiles=d.profiles; root.current=d.current;
      }
      // 欠損キーを補完
      for(const id in root.profiles){
        root.profiles[id]=Object.assign(defaultProfile(), root.profiles[id]);
      }
      if(!root.profiles[root.current]) root.current=Object.keys(root.profiles)[0];
      return root;
    }
  }catch(e){}
  // 旧フォーマット（単一児童 yumemon_v3）からの自動移行
  try{
    const old=localStorage.getItem(OLD_KEY);
    if(old){
      const o=JSON.parse(old);
      const root=defaultRoot();
      const id=root.current;
      root.staffPin     = o.staffPin     || "1111";
      root.customDaily  = o.customDaily  || null;
      root.customWeekly = o.customWeekly || null;
      root.customRewards= o.customRewards|| null;
      root.profiles[id] = Object.assign(defaultProfile(), {
        name:o.name, avatar:o.avatar, points:o.points, spent:o.spent,
        stats:o.stats, dailyDone:o.dailyDone, weekly:o.weekly,
        skillCount:o.skillCount, claimed:o.claimed, emotion:o.emotion,
        lastDate:o.lastDate, lastWeek:o.lastWeek, history:o.history,
        badges:o.badges, timerComplete:o.timerComplete
      });
      localStorage.setItem(ROOT_KEY, JSON.stringify(root));
      return root;
    }
  }catch(e){}
  return defaultRoot();
}

const CONFETTI_COLORS=['#E8197D','#4EC5E0','#FFC93C','#22C55E','#8B5CF6','#FF8C42','#FF6B35','#fff'];
function confetti(cx, cy){
  const container=document.body;
  const bx=cx||window.innerWidth/2;
  const by=cy||window.innerHeight*0.3;
  for(let i=0;i<38;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const color=CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)];
    const size=6+Math.random()*8;
    const angle=Math.random()*360;
    const vx=(Math.random()-0.5)*14;
    const vy=-(Math.random()*12+4);
    p.style.cssText=`left:${bx}px;top:${by}px;width:${size}px;height:${size}px;background:${color};border-radius:${Math.random()>0.5?'50%':'2px'};transform:rotate(${angle}deg);position:fixed;pointer-events:none;z-index:400;`;
    container.appendChild(p);
    let posX=bx, posY=by, velX=vx, velY=vy, alpha=1, rot=angle;
    const gravity=0.55, drag=0.97;
    let frame;
    (function animate(){
      velY+=gravity; velX*=drag; posX+=velX; posY+=velY; alpha-=0.018; rot+=velX*2;
      p.style.left=posX+'px'; p.style.top=posY+'px';
      p.style.opacity=Math.max(0,alpha);
      p.style.transform=`rotate(${rot}deg)`;
      if(alpha>0){ frame=requestAnimationFrame(animate); }
      else{ cancelAnimationFrame(frame); if(p.parentNode) p.parentNode.removeChild(p); }
    })();
  }
}

/* ======================================================
   Web Audio API 効果音
====================================================== */
let audioCtx = null;
function getAudioCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq=520, dur=0.12, type='sine', vol=0.25){
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type=type; osc.frequency.setValueAtTime(freq,ctx.currentTime);
    gain.gain.setValueAtTime(vol,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.start(); osc.stop(ctx.currentTime+dur);
  }catch(e){}
}
function playSound(type){
  if(type==='mission'){ beep(660,.09); setTimeout(()=>beep(880,.12),100); }
  else if(type==='badge'){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*80)); }
  else if(type==='timer'){ [440,554,659,880].forEach((f,i)=>setTimeout(()=>beep(f,.2),i*120)); }
  else if(type==='reward'){ beep(784,.1); setTimeout(()=>beep(1047,.18),120); }
  else if(type==='tap'){ beep(440,.07,'sine',0.15); }
}

/* ======================================================
   集中タイマー
====================================================== */
let timerSec=0, timerTotal=0, timerRunning=false, timerInterval=null, timerPhaseBreak=false;
const TIMER_PRESETS=[
  {label:'5分',  focus:5*60,  brk:60,   emoji:'🌟'},
  {label:'10分', focus:10*60, brk:2*60, emoji:'⚡'},
  {label:'15分', focus:15*60, brk:3*60, emoji:'🔥'},
  {label:'25分', focus:25*60, brk:5*60, emoji:'💎'},
];
let timerPresetIdx=1;

function setTimerPreset(i){
  if(timerRunning) return;
  timerPresetIdx=i;
  timerTotal=TIMER_PRESETS[i].focus;
  timerSec=timerTotal;
  timerPhaseBreak=false;
  updateTimerUI();
}

function startTimer(){
  if(timerRunning) return;
  if(timerSec<=0){ setTimerPreset(timerPresetIdx); }
  timerRunning=true;
  timerInterval=setInterval(tickTimer,1000);
  updateTimerUI();
  beep(440,.06);
}

function stopTimer(){
  timerRunning=false;
  clearInterval(timerInterval);
  updateTimerUI();
  beep(330,.08);
}

function resetTimer(){
  stopTimer();
  timerPhaseBreak=false;
  timerTotal=TIMER_PRESETS[timerPresetIdx].focus;
  timerSec=timerTotal;
  updateTimerUI();
}

function tickTimer(){
  timerSec--;
  if(timerSec<=0){
    clearInterval(timerInterval);
    timerRunning=false;
    if(!timerPhaseBreak){
      // 集中フェーズ完了
      S.timerComplete=(S.timerComplete||0)+1;
      bump('focus');
      S.points+=2;
      playSound('timer');
      confetti();
      flash('🎯 集中タイム完了！ +2pt 集中力UP！');
      afterAction();
      // 休憩フェーズへ
      timerPhaseBreak=true;
      timerTotal=TIMER_PRESETS[timerPresetIdx].brk;
      timerSec=timerTotal;
      setTimeout(()=>{
        timerRunning=true;
        timerInterval=setInterval(tickTimer,1000);
        updateTimerUI();
      }, 2000);
    } else {
      // 休憩完了
      timerPhaseBreak=false;
      timerTotal=TIMER_PRESETS[timerPresetIdx].focus;
      timerSec=timerTotal;
      playSound('tap');
      flash('😊 休憩おわり！また集中しよう！');
    }
  }
  updateTimerUI();
}

function updateTimerUI(){
  const ring=document.getElementById('timerRingFg');
  const timeEl=document.getElementById('timerTime');
  const phaseEl=document.getElementById('timerPhase');
  const startBtn=document.getElementById('timerStartBtn');
  const stopBtn=document.getElementById('timerStopBtn');
  if(!ring||!timeEl) return;

  const total=timerTotal||1;
  const pct=timerSec/total;
  const circumference=2*Math.PI*80;
  ring.style.strokeDasharray=circumference;
  ring.style.strokeDashoffset=circumference*(1-pct);

  const color=timerPhaseBreak?'#22C55E':(timerSec<60?'#EF4444':
               timerSec<timerTotal*0.3?'#FF8C42':'#4EC5E0');
  ring.style.stroke=color;

  const m=Math.floor(timerSec/60);
  const s=timerSec%60;
  timeEl.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  timeEl.style.color=color;

  if(phaseEl) phaseEl.textContent=timerPhaseBreak?'😊 休憩タイム中':'🎯 集中タイム中';
  if(startBtn) startBtn.style.display=timerRunning?'none':'block';
  if(stopBtn)  stopBtn.style.display=timerRunning?'block':'none';
}

function doRebirth(id){
  if(!rebirthAvailable()) return;
  const job=jobOf(id);
  if(!job || !jobUnlocked(job)) return;
  S.rebirthStar=(S.rebirthStar||0)+1;
  S.rebirthJob=id;
  if(!S.rebirthJobs) S.rebirthJobs=[];
  const isNew=!S.rebirthJobs.includes(id);
  if(isNew) S.rebirthJobs.push(id);
  save();
  const m=document.getElementById('rebirthModal'); if(m) m.remove();
  showRebirthCelebrate(job, isNew);
  render();
}

function renderRankHero(){

/* ======================================================
   レーダーチャート
====================================================== */
function drawRadar(){
  const cv=document.getElementById('radar'); if(!cv) return;
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height, cx=W/2, cy=H/2+10, R=Math.min(W,H)*0.34;
  const n=STATS.length;
  ctx.clearRect(0,0,W,H);
  for(let ring=1; ring<=5; ring++){
    const rr=R*ring/5;
    ctx.beginPath();
    for(let i=0;i<=n;i++){
      const a=-Math.PI/2+i*2*Math.PI/n;
      const x=cx+rr*Math.cos(a), y=cy+rr*Math.sin(a);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.strokeStyle='#D1E9F0'; ctx.lineWidth=1.5; ctx.stroke();
  }
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+R*Math.cos(a), cy+R*Math.sin(a));
    ctx.strokeStyle='#D1E9F0'; ctx.lineWidth=1.5; ctx.stroke();
  }
  ctx.beginPath();
  for(let i=0;i<=n;i++){
    const idx=i%n;
    const a=-Math.PI/2+idx*2*Math.PI/n;
    const v=S.stats[STATS[idx].key]/10;
    const x=cx+R*v*Math.cos(a), y=cy+R*v*Math.sin(a);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
  ctx.fillStyle='rgba(232,25,125,0.38)'; ctx.fill();
  ctx.strokeStyle='#E8197D'; ctx.lineWidth=3; ctx.stroke();
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n;
    const v=S.stats[STATS[i].key]/10;
    const x=cx+R*v*Math.cos(a), y=cy+R*v*Math.sin(a);
    ctx.beginPath(); ctx.arc(x,y,5,0,2*Math.PI);
    ctx.fillStyle='#E8197D'; ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
  }
  ctx.font='bold 22px -apple-system,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=0;i<n;i++){
    const a=-Math.PI/2+i*2*Math.PI/n;
    const lr=R+38;
    const x=cx+lr*Math.cos(a), y=cy+lr*Math.sin(a);
    ctx.fillStyle='#1A3A6B';
    ctx.fillText(STATS[i].icon+STATS[i].label, x, y);
  }
}

function pinPress(key){
  playSound('tap');
  if(key==='⌫'){
    pinInput=pinInput.slice(0,-1);
  } else if(/^\d$/.test(key) && pinInput.length<4){
    pinInput+=key;
  }
  if(pinInput.length===4){
    if(pinInput===ROOT.staffPin){
      staffUnlocked=true; pinInput='';
      flash('🔓 スタッフモード解除！');
      render();
    } else {
      flash('❌ PINが違います'); pinInput='';
      render();
    }
    return;
  }
  // 入力表示だけ更新
  const disp=document.getElementById('pinDisplay');
  if(disp){
    disp.textContent='●'.repeat(pinInput.length)+'○'.repeat(Math.max(0,4-pinInput.length));
  }
}

function changePin(){
  const v=document.getElementById("newPin").value.trim();
  if(!v||v.length!==4||!/^\d{4}$/.test(v)){ flash("❌ 4桁の数字を入力してください"); return; }
  ROOT.staffPin=v; save(); flash("✅ PINコードを変更しました");
}

function addMission(type){
  const text=prompt("ミッションの内容を入力してください");
  if(!text||!text.trim()) return;
  const icon=prompt("絵文字を入力（例: ⭐ 🎯 📚）")||"⭐";
  const ptStr=prompt("ポイント数（例: 1）")||"1";
  const pt=Math.max(1,Math.min(20,parseInt(ptStr)||1));
  const stat=prompt("関連スキル (focus/patience/heart/social/physical/intelligence)")||"focus";
  const validStat=STATS.find(s=>s.key===stat)?stat:"focus";
  const newM={ id:"c"+Date.now(), text:text.trim(), icon:icon.trim()||"⭐", pt, stat:validStat };
  if(type==="daily"){
    ROOT.customDaily=[...getDaily(), newM];
  } else {
    const goalStr=prompt("目標回数（例: 3）")||"3";
    const goal=Math.max(1,Math.min(30,parseInt(goalStr)||3));
    newM.goal=goal; newM.pt=pt*3;
    ROOT.customWeekly=[...getWeekly(), newM];
  }
  save(); render(); flash("✅ ミッションを追加しました");
}

function editMission(type,i){
  const list=type==="daily"?getDaily():getWeekly();
  const m={...list[i]};
  const text=prompt("ミッションの内容", m.text);
  if(!text||!text.trim()) return;
  m.text=text.trim();
  m.icon=(prompt("絵文字", m.icon)||m.icon).trim()||m.icon;
  m.pt=Math.max(1,Math.min(20,parseInt(prompt("ポイント数", m.pt)||m.pt)||m.pt));
  if(type==="daily"){
    const d=[...getDaily()]; d[i]=m; ROOT.customDaily=d;
  } else {
    m.goal=Math.max(1,Math.min(30,parseInt(prompt("目標回数", m.goal)||m.goal)||m.goal));
    const w=[...getWeekly()]; w[i]=m; ROOT.customWeekly=w;
  }
  save(); render(); flash("✅ ミッションを更新しました");
}

function deleteMission(type,i){
  if(!confirm("このミッションを削除しますか？")) return;
  if(type==="daily"){ const d=[...getDaily()]; d.splice(i,1); ROOT.customDaily=d; }
  else { const w=[...getWeekly()]; w.splice(i,1); ROOT.customWeekly=w; }
  save(); render(); flash("🗑️ 削除しました");
}

/* ======================================================
   イベントハンドラ
====================================================== */
function attachHandlers(){
  document.querySelectorAll('[data-daily]').forEach(el=>{
    el.onclick=()=>{
      const id=el.getAttribute('data-daily');
      if(S.dailyDone.includes(id)) return;
      const m=getDaily().find(x=>x.id===id);
      if(!m) return;
      S.dailyDone.push(id); S.points+=m.pt; bump(m.stat); S.skillCount++;
      playSound('mission');
      confetti();
      flash('✨ ミッション達成！「'+m.text+'」 +'+m.pt+'pt');
      afterAction();
    };
  });

  document.querySelectorAll('[data-weekly]').forEach(el=>{
    el.onclick=(ev)=>{
      ev.stopPropagation();
      const id=el.getAttribute('data-weekly');
      const m=getWeekly().find(x=>x.id===id);
      if(!m) return;
      const cur=S.weekly[id]||0;
      if(cur>=m.goal) return;
      const next=cur+1; S.weekly[id]=next; bump(m.stat);
      if(next>=m.goal){
        S.points+=m.pt;
        playSound('badge');
        confetti();
        flash('🏆 ウィークリー達成！ +'+m.pt+'pt');
      } else {
        playSound('tap');
        flash('👍 進捗 '+next+'/'+m.goal);
      }
      afterAction();
    };
  });

  document.querySelectorAll('[data-bump]').forEach(el=>{
    el.onclick=()=>{
      const k=el.getAttribute('data-bump');
      const s=statOf(k); if(!s) return;
      bump(k); S.skillCount++; S.points+=1;
      playSound('mission');
      flash(s.icon+' '+s.label+' Lvアップ！ +1pt');
      afterAction();
    };
  });

  document.querySelectorAll('[data-emo]').forEach(el=>{
    el.onclick=()=>{
      const lv=parseInt(el.getAttribute('data-emo'));
      S.emotion=lv;
      playSound('tap');
      if(lv>=4){ bump('heart'); S.points+=1; flash('❤️ こころ力 +1！よく言えたね'); }
      else { flash(EMOTIONS[lv-1].emoji+' '+EMOTIONS[lv-1].label+'を選んだよ'); }
      afterAction();
    };
  });

  document.querySelectorAll('[data-reward]').forEach(el=>{
    el.onclick=()=>{
      const id=el.getAttribute('data-reward');
      const r=getRewards().find(x=>x.id===id);
      if(!r) return;
      if(avail()<r.cost){ flash('まだポイントが足りないよ（あと'+(r.cost-avail())+'pt）'); return; }
      S.spent+=r.cost;
      S.claimed.push({icon:r.icon, text:r.text, date:new Date().toLocaleDateString('ja-JP')});
      playSound('reward');
      confetti();
      flash('🎁 「'+r.text+'」をゲット！');
      afterAction();
    };
  });
}

function exportData(){
  const blob=new Blob([JSON.stringify(ROOT,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url; a.download='夢門塾冒険の書バックアップ_'+stamp+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  flash('📤 ぜんいんの記録を書き出しました！');
}

function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const d=JSON.parse(reader.result);
      // 基本的な型チェック
      if(typeof d!=='object'||d===null||Array.isArray(d)) throw new Error();
      if(d.profiles && typeof d.profiles==='object' && !Array.isArray(d.profiles)){
        // 施設まるごとバックアップ
        ROOT=Object.assign(defaultRoot(), d);
        for(const id in ROOT.profiles){
          ROOT.profiles[id]=Object.assign(defaultProfile(), ROOT.profiles[id]);
        }
        if(!ROOT.profiles[ROOT.current]) ROOT.current=Object.keys(ROOT.profiles)[0];
        S=ROOT.profiles[ROOT.current];
        flash('📥 ぜんいんの記録を読み込みました！');
      } else {
        // 旧：単一児童ファイル → 今の冒険者に取り込み
        ROOT.profiles[ROOT.current]=Object.assign(defaultProfile(), d);
        S=ROOT.profiles[ROOT.current];
        flash('📥 記録を読み込みました！');
      }
      save(); render();
    }catch(e){ flash('⚠️ ファイルを読めませんでした'); }
  };
  reader.readAsText(file);
  ev.target.value='';
}

function resetData(){
  if(confirm('「'+(S.name||'この冒険者')+'」をさいしょからやり直しますか？\nこの冒険者の記録だけが消えます。\n（他の冒険者の記録は残ります）')){
    ROOT.profiles[ROOT.current]=defaultProfile();
    S=ROOT.profiles[ROOT.current];
    save(); tab=0; render();
    flash('🔄 さいしょに戻しました');
  }
}

/* ======================================================
   日付ウィジェット・自動リセット
====================================================== */
function getWeekNum(d){
  const date=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const jan1=new Date(d.getFullYear(),0,1);
  return Math.ceil(((date-jan1)/86400000+jan1.getDay()+1)/7);
}

// 1人分の日付リセット（現在の児童ならメッセージを返す）
function resetProfileForDate(p, today, thisWeek){
  let msg=null;
  if(p.lastDate===''){
    p.lastDate=today; p.lastWeek=thisWeek; return null;
  }
  if(p.lastDate!==today){
    const prevDone=p.dailyDone.length;
    p.history.unshift({
      date:p.lastDate, dailyDone:[...p.dailyDone],
      emotion:p.emotion, pts:p.points
    });
    if(p.history.length>30) p.history=p.history.slice(0,30);
    p.dailyDone=[]; p.emotion=null; p.lastDate=today;
    msg='🌅 新しい日が始まった！今日も冒険しよう！（昨日は'+prevDone+'個のミッションをクリア）';
    if(thisWeek!==p.lastWeek){
      p.weekly={}; p.lastWeek=thisWeek;
      msg+=' 📅 新しい週が始まった！';
    }
  }
  return msg;
}

// 全児童に日付リセットを適用。現在の児童のメッセージを返す
function checkDateReset(){
  const today=new Date().toLocaleDateString('ja-JP');
  const thisWeek=getWeekNum(new Date());
  let msg=null;
  for(const id in ROOT.profiles){
    const m=resetProfileForDate(ROOT.profiles[id], today, thisWeek);
    if(id===ROOT.current) msg=m;
  }
  if(msg){ bEnemy=null; bPhase='start'; }
  save();
  return msg;
}

/* ======================================================
   バトル
====================================================== */
// --- 定数 ---
const B_AP_MAX=6, B_AP_REGEN=1;
const B_ATK_BUFF=1.6, B_DEF_BUFF=0.55, B_BUFF_TURNS=3;

// --- 敵定義 ---
const B_ENEMY_NAMES=['モヤモヤくん','やみのコウモリ','あんこくのトカゲ','くらやみの兵士','やみの将軍','モヤモヤ大王'];
const B_ENEMY_EMOJIS=['😤','🦇','🦎','💂','🗡️','👿'];
const B_ENEMY_ATK=[ [12,17],[14,19],[16,22],[18,24] ];

// --- プレイヤースキル ---
const B_SKILLS=[
  {key:'physical',    name:'たいあたり',       icon:'💥', color:'#FF8C42', type:'atk',      cost:1, baseDmg:[7,11],  desc:'7〜11 ダメージ',         msg:'おもいきり たいあたり！'},
  {key:'focus',       name:'ひかりのつるぎ',   icon:'⚔️', color:'#4EC5E0', type:'atk',      cost:3, baseDmg:[19,25], desc:'19〜25 ダメージ（つよい！）', msg:'しゅうちゅうの いちげき！ひかりのつるぎがさく裂！'},
  {key:'intelligence',name:'みやぶる',         icon:'🔮', color:'#8B5CF6', type:'atk',      cost:2, baseDmg:[13,18], desc:'13〜18 ダメージ',         msg:'よわてんを みやぶった！するどい いちげき！'},
  {key:'social',      name:'なかまの こえ',    icon:'📣', color:'#22C55E', type:'atk',      cost:2, baseDmg:[11,15], desc:'11〜15 ダメージ',         msg:'なかまのこえが ひびく！'},
  {key:'heart',       name:'いやしのひかり',   icon:'✨', color:'#E8197D', type:'heal',     cost:3, healAmt:22,      desc:'HP を 22＋ かいふく',     msg:'やさしいひかりに つつまれた。'},
  {key:'patience',    name:'ガード',           icon:'🛡️', color:'#EF4444', type:'guard',    cost:1,                 desc:'つぎの こうげき はんぶん', msg:'ぐっと こらえる かまえ！'},
  {key:'atkup',       name:'こうげきアップ',   icon:'🔥', color:'#F97316', type:'atkup',    cost:2,                 desc:'3ターン ダメージ ×1.6',   msg:'ちからが みなぎる！こうげきアップ！'},
  {key:'defup',       name:'ぼうぎょアップ',   icon:'🛡', color:'#2563EB', type:'defup',    cost:2,                 desc:'3ターン ダメージ ×0.55',  msg:'からだがかたくなる！ぼうぎょアップ！'},
  {key:'charge',      name:'きあいをためる',   icon:'💫', color:'#FFD23F', type:'apcharge', cost:0, apGain:3,       desc:'⚡きあいが ＋3 かいふく',  msg:'すーはー…　きあいをため直した！', wide:true},
];

// --- 敵行動 ---
const B_ENEMY_MOVES=[
  {w:32,type:'atk',  name:'モヤモヤパンチ'},
  {w:16,type:'atk',  name:'おおきな ためいき', dmgMult:0.7},
  {w:16,type:'charge',name:'くらやみを ためる'},
  {w:20,type:'heal', name:'モヤモヤを すいこむ'},
  {w:12,type:'buff', name:'やみの ちからため'},
];
const B_ULT={name:'くらやみの渦'};

// --- バトル状態 ---
let bEnemy=null, bPhase='start';
let bHeroHP=0, bEHP=0, bHeroMax=0, bEMax=0;
let bAP=B_AP_MAX, bGuard=false, bHeroAtk=1, bHeroDef=1;
let bAtkUpT=0, bDefUpT=0, bEnemyAtkUpT=0;
let bCharged=false, bTurn='player', bBusy=false;

function bToday(){ return new Date().toLocaleDateString('ja-JP'); }

// --- 敵を生成（当日1回・ステータス合計に応じて強さ・見た目が変化）---
function genDailyEnemy(){
  const st=S.stats||{};
  const sum=Object.values(st).reduce((a,v)=>a+(v||1),0);   // 6〜60
  // 攻撃力ティア（4段階）
  const tier = sum<12?0 : sum<24?1 : sum<40?2 : 3;
  // 見た目・名前（6段階：ステータスが育つほど強そうな敵に）
  const nameIdx = Math.min(B_ENEMY_NAMES.length-1, Math.floor((sum-6)/9));
  const eMax=Math.round(50+sum*1.7);
  const hMax=44+Math.round(sum*1.35);
  const [aMin,aMax]=B_ENEMY_ATK[tier];
  const name=B_ENEMY_NAMES[nameIdx];
  const emoji=B_ENEMY_EMOJIS[nameIdx];
  return {eMax, hMax, aMin, aMax, tier, name, emoji, sum};
}

// --- スキルダメージ（ステータスLvでスケール）---
function bSkillDmg(skill){
  const lv=S.stats[skill.key]||1;
  const [mn,mx]=skill.baseDmg;
  const scale=1+(lv-1)*0.08;
  return Math.round((mn+Math.random()*(mx-mn))*scale*bHeroAtk);
}

function bSetAP(){
  document.querySelectorAll('.b-ap-pip').forEach((p,i)=>p.classList.toggle('on',i<bAP));
}
function bSetHP(){
  const hBar=document.getElementById('bHeroBar'), eBar=document.getElementById('bEnemyBar');
  const hLbl=document.getElementById('bHeroLbl'), eLbl=document.getElementById('bEnemyLbl');
  const hPct=Math.max(0,bHeroHP/bHeroMax*100);
  const ePct=Math.max(0,bEHP/bEMax*100);
  if(hBar) hBar.style.width=hPct+'%';
  if(eBar){
    eBar.style.width=ePct+'%';
    const c=ePct>50?'#EF4444':ePct>25?'#F97316':'#DC2626';
    eBar.style.background=`linear-gradient(90deg,${c},#FCA5A5)`;
  }
  if(hLbl) hLbl.textContent=Math.max(0,bHeroHP)+'/'+bHeroMax;
  if(eLbl){
    const c=ePct>50?'#EF4444':ePct>25?'#F97316':'#DC2626';
    eLbl.textContent=Math.max(0,bEHP)+'/'+bEMax;
    eLbl.style.color=c;
  }
}
function bLog(html){
  const el=document.getElementById('bLog');
  if(el) el.innerHTML='<p>'+html+'</p>'+el.innerHTML;
}
function bRefreshCmd(){
  document.querySelectorAll('.bcmd').forEach(b=>{
    const s=B_SKILLS[+b.dataset.si]; if(!s) return;
    const lock=s.type==='apcharge'?false:s.cost>bAP;
    b.disabled=(bTurn!=='player')||bBusy||lock;
  });
}
function bPop(slotId, text, color){
  const slot=document.getElementById(slotId); if(!slot) return;
  const el=document.createElement('div');
  el.className='bdmg'; el.textContent=text;
  el.style.color=color||'#EF4444';
  el.style.left=Math.random()*40+30+'%'; el.style.top='10px';
  slot.style.position='relative'; slot.appendChild(el);
  setTimeout(()=>el.remove(),900);
}
function bShake(id){
  const el=document.getElementById(id); if(!el) return;
  el.style.animation='none';
  setTimeout(()=>el.style.animation='bshake .3s ease',10);
}

// --- 結果画面 ---
function bShowResult(won){
  bPhase=won?'win':'rest';
  const el=document.getElementById('bBattle'); if(!el) return;
  if(won){
    if(S.lastBattleDate!==bToday()){
      S.lastBattleDate=bToday();
      S.points=(S.points||0)+2;
      save(); checkBadges(); save();
    }
    el.innerHTML=`<div class="b-res">
      <div class="b-res-emoji">🏆</div>
      <h3>しょうり！</h3>
      <p>${bEnemy.name}を たおした！<br>ポイント +2 ゲット！</p>
      <button onclick="bEnemy=null;bPhase='start';render()">もどる</button>
    </div>`;
    confetti(); playSound('reward');
  } else {
    el.innerHTML=`<div class="b-res">
      <div class="b-res-emoji">😴</div>
      <h3>ひとやすみ…</h3>
      <p>つかれてしまった。また いつでも挑戦できるよ！</p>
      <button onclick="bPhase='battle';bHeroHP=bHeroMax;bAP=B_AP_MAX;bCharged=false;bGuard=false;bHeroAtk=1;bHeroDef=1;bAtkUpT=0;bDefUpT=0;bEnemyAtkUpT=0;bTurn='player';bBusy=false;render()">もう一度</button>
    </div>`;
  }
}

// --- 敵ターン ---
function bEnemyTurn(){
  bTurn='enemy'; bRefreshCmd();
  const el=document.getElementById('bEnemySlot');
  if(bEnemyAtkUpT>0) bEnemyAtkUpT--;

  const moves=B_ENEMY_MOVES.filter(m=>{
    if(m.type==='heal' && bEHP>bEMax*0.6) return false;
    return true;
  });
  const total=moves.reduce((a,m)=>a+m.w,0);
  let r=Math.random()*total, chosen=moves[moves.length-1];
  for(const m of moves){ r-=m.w; if(r<=0){ chosen=m; break; } }

  let msg='';
  if(bCharged && chosen.type!=='charge'){
    const ultMult=(bEnemyAtkUpT>0)?1.3:1;
    const dmg=Math.round((bEnemy.aMin*1.8+Math.random()*(bEnemy.aMax-bEnemy.aMin)*1.8)*ultMult);
    const actual=Math.round(dmg*bHeroDef*(bGuard?B_DEF_BUFF:1));
    bHeroHP=Math.max(0,bHeroHP-actual);
    bShake('bHeroSlot'); bPop('bHeroSlot','-'+actual,'#EF4444');
    msg=`⚡ ${B_ULT.name}！ <b>${actual}</b> ダメージ！`;
    if(bGuard) msg+=' <span style="color:#2563EB">（ガードで半減！）</span>';
    bCharged=false; bGuard=false;
  } else if(chosen.type==='charge'){
    bCharged=true;
    msg=`💨 <b>${chosen.name}</b> — 次のターン、大技を放つ！`;
    if(el){ el.style.filter='brightness(1.5)'; setTimeout(()=>{ if(el) el.style.filter=''; },600); }
  } else if(chosen.type==='heal'){
    const healAmt=Math.round(bEMax*0.12);
    bEHP=Math.min(bEMax,bEHP+healAmt);
    bPop('bEnemySlot','+'+healAmt,'#22C55E');
    msg=`💚 <b>${chosen.name}</b> — ${healAmt} 回復！`;
  } else if(chosen.type==='buff'){
    bEnemyAtkUpT=B_BUFF_TURNS;
    msg=`🔥 <b>${chosen.name}</b> — 敵の攻撃力アップ！`;
  } else {
    const mult=(chosen.dmgMult||1)*(bEnemyAtkUpT>0?1.3:1);
    const dmg=Math.round((bEnemy.aMin+Math.random()*(bEnemy.aMax-bEnemy.aMin))*mult);
    const actual=Math.round(dmg*bHeroDef*(bGuard?B_DEF_BUFF:1));
    bHeroHP=Math.max(0,bHeroHP-actual);
    bShake('bHeroSlot'); bPop('bHeroSlot','-'+actual,'#EF4444');
    msg=`👹 <b>${chosen.name}</b> — <b>${actual}</b> ダメージ！`;
    if(bGuard) msg+=' <span style="color:#2563EB">（ガードで半減！）</span>';
    bGuard=false;
  }
  bLog(msg); bSetHP();

  setTimeout(()=>{
    bTurn='player'; bBusy=false;
    bAP=Math.min(B_AP_MAX,bAP+B_AP_REGEN); bSetAP();
    if(bAtkUpT>0){ bAtkUpT--; if(bAtkUpT===0) bHeroAtk=1; }
    if(bDefUpT>0){ bDefUpT--; if(bDefUpT===0) bHeroDef=1; }
    if(bHeroHP<=0){ bShowResult(false); return; }
    bRefreshCmd();
    const tp=document.getElementById('bTurnPill'); if(tp) tp.textContent='あなたのターン';
  },700);
}

// --- プレイヤーターン ---
function bPlayerTurn(si){
  if(bTurn!=='player'||bBusy) return;
  const s=B_SKILLS[si]; if(!s) return;
  if(s.type!=='apcharge' && s.cost>bAP) return;
  bBusy=true; bRefreshCmd();
  const tp=document.getElementById('bTurnPill'); if(tp) tp.textContent='しょりちゅう…';

  if(s.type==='atk'){
    bAP=Math.max(0,bAP-s.cost); bSetAP();
    const dmg=bSkillDmg(s);
    bEHP=Math.max(0,bEHP-dmg);
    bShake('bEnemySlot'); bPop('bEnemySlot','-'+dmg,'#EF4444');
    bLog(`⚔️ <b>${s.name}</b> — ${s.msg} <b>${dmg}</b> ダメージ！`);
    bSetHP();
    if(bEHP<=0){ bShowResult(true); return; }
  } else if(s.type==='heal'){
    bAP=Math.max(0,bAP-s.cost); bSetAP();
    const h=s.healAmt+(S.stats.heart||1)*2;
    bHeroHP=Math.min(bHeroMax,bHeroHP+h);
    bPop('bHeroSlot','+'+h,'#22C55E');
    bLog(`✨ <b>${s.name}</b> — ${h} HP 回復！`); bSetHP();
  } else if(s.type==='guard'){
    bAP=Math.max(0,bAP-s.cost); bSetAP();
    bGuard=true; bLog(`🛡️ <b>${s.name}</b> — ${s.msg}`);
  } else if(s.type==='atkup'){
    bAP=Math.max(0,bAP-s.cost); bSetAP();
    bHeroAtk=B_ATK_BUFF; bAtkUpT=B_BUFF_TURNS;
    bLog(`🔥 <b>${s.name}</b> — ${s.msg}`);
  } else if(s.type==='defup'){
    bAP=Math.max(0,bAP-s.cost); bSetAP();
    bHeroDef=B_DEF_BUFF; bDefUpT=B_BUFF_TURNS;
    bLog(`🛡 <b>${s.name}</b> — ${s.msg}`);
  } else if(s.type==='apcharge'){
    bAP=Math.min(B_AP_MAX,bAP+s.apGain); bSetAP();
    bPop('bHeroSlot','⚡+'+s.apGain,'#FFD23F');
    bLog(`💫 <b>${s.name}</b> — ${s.msg}`);
  }
  setTimeout(()=>bEnemyTurn(), 500);
}

// --- バトル画面のHTML ---
function renderBattle(){
  if(!S.lastBattleDate) S.lastBattleDate='';

  if(bPhase==='start'){
    bEnemy=genDailyEnemy();
    bHeroMax=bEnemy.hMax; bEMax=bEnemy.eMax;
    bHeroHP=bHeroMax; bEHP=bEMax;
    bAP=B_AP_MAX; bGuard=false;
    bHeroAtk=1; bHeroDef=1;
    bAtkUpT=0; bDefUpT=0; bEnemyAtkUpT=0;
    bCharged=false; bTurn='player'; bBusy=false;
    bPhase='battle';
  }

  if(bPhase==='win'||bPhase==='rest'){
    const emoji=bPhase==='win'?'🏆':'😴';
    const title=bPhase==='win'?'しょうり！':'ひとやすみ…';
    const sub=bPhase==='win'?`${bEnemy.name}を たおした！<br>ポイント +2 ゲット！`:'つかれてしまった。また いつでも挑戦できるよ！';
    const btnLabel=bPhase==='win'?'もどる':'もう一度';
    const btnAct=bPhase==='win'?`bEnemy=null;bPhase='start';render()`:`bPhase='battle';bHeroHP=bHeroMax;bAP=B_AP_MAX;bCharged=false;bGuard=false;bHeroAtk=1;bHeroDef=1;bAtkUpT=0;bDefUpT=0;bEnemyAtkUpT=0;bTurn='player';bBusy=false;render()`;
    return `<div class="sect"><div class="b-res">
      <div class="b-res-emoji">${emoji}</div>
      <h3>${title}</h3><p>${sub}</p>
      <button onclick="${btnAct}">${btnLabel}</button>
    </div></div>`;
  }

  const skillsHTML=B_SKILLS.map((s,i)=>{
    const costTxt=s.cost===0
      ?`<span class="bcost" style="color:#FFD23F">FREE</span>`
      :`<span class="bcost">⚡${s.cost}</span>`;
    const wide=s.wide?'wide':'';
    return `<button class="bcmd ${wide}" data-si="${i}" style="background:${s.color}" onclick="bPlayerTurn(${i})">
      <span class="bicon">${s.icon}</span>
      <span class="bname">${s.name}</span>
      ${costTxt}
      <span class="bdesc">${s.desc||''}</span>
    </button>`;
  }).join('');

  const apPips=Array.from({length:B_AP_MAX},(_,i)=>`<span class="b-ap-pip${i<bAP?' on':''}"></span>`).join('');
  const chargeWarn=bCharged
    ?`<div style="background:#FEF2F2;border:2px solid #EF4444;border-radius:10px;padding:6px 10px;text-align:center;font-size:12px;font-weight:800;color:#EF4444;width:100%">⚠️ てきが チャージちゅう！<br><span style="font-size:10px;font-weight:700">ガードで ダメージを はんぶんにできる！</span></div>`
    :'';
  const eHPpct=Math.max(0,bEHP/bEMax*100);
  const hHPpct=Math.max(0,bHeroHP/bHeroMax*100);
  const eHPcolor=eHPpct>50?'#EF4444':eHPpct>25?'#F97316':'#DC2626';

  return `<div class="sect"><div id="bBattle" class="bstage">
    <div class="b-tpill" id="bTurnPill">あなたのターン</div>
    ${chargeWarn}

    <!-- てきのHP（大きく表示） -->
    <div style="width:100%;background:#FFF5F5;border:2px solid #FCA5A5;border-radius:14px;padding:10px 12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
        <div style="font-size:14px;font-weight:900;color:#1A3A6B">${bEnemy.emoji} <span style="font-size:13px">${bEnemy.name}</span></div>
        <div style="font-size:10px;font-weight:700;color:#9CA3AF">てきの HP</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div style="flex:1;height:16px;background:#FEE2E2;border-radius:8px;overflow:hidden">
          <div id="bEnemyBar" style="height:100%;width:${eHPpct}%;background:linear-gradient(90deg,${eHPcolor},#FCA5A5);border-radius:8px;transition:width .4s"></div>
        </div>
        <div style="font-size:15px;font-weight:900;color:${eHPcolor};min-width:64px;text-align:right" id="bEnemyLbl">${bEHP}/${bEMax}</div>
      </div>
    </div>

    <!-- キャラクター -->
    <div class="b-field">
      <div class="b-hpanel">
        <div class="b-hname">${S.avatar||'🌱'} ${esc(S.name||'ゆうしゃ')}</div>
        <div class="bhp-row">
          <div class="bhp-bar"><div class="bhp-fill hero" id="bHeroBar" style="width:${hHPpct}%"></div></div>
          <span id="bHeroLbl" style="font-size:11px">${bHeroHP}/${bHeroMax}</span>
        </div>
        <div style="font-size:9px;color:#6B7280;margin-top:1px">じぶんの HP</div>
        <div class="b-ap">${apPips}</div>
        <div style="font-size:9px;color:#6B7280;margin-top:1px">⚡きあい</div>
      </div>
      <div id="bHeroSlot" class="b-char hero-c">${S.avatar||'🌱'}</div>
      <div id="bEnemySlot" class="b-char enemy-c">${bEnemy.emoji}</div>
    </div>

    <div class="b-log" id="bLog"><p>⚔️ バトルかいし！ ${bEnemy.name} があらわれた！</p></div>
    <div style="font-size:11px;font-weight:700;color:#6B7280;margin-bottom:4px">わざをえらんで たたかおう！</div>
    <div class="bcmd-grid">${skillsHTML}</div>
  </div></div>`;
}

function bMount(){
  if(bPhase==='battle'){ bBusy=false; bTurn='player'; }
  bRefreshCmd();
}

/* ======================================================
   初期化
====================================================== */
// タイマー初期化
timerTotal=TIMER_PRESETS[timerPresetIdx].focus;
timerSec=timerTotal;

const resetMsg=checkDateReset();
checkBadges();
save();
render();
if(resetMsg){ setTimeout(()=>flash(resetMsg),400); }
</script>
